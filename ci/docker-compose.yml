services:
  jenkins:
    build: .
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080" #interfaz web
      - "50000:50000" #conexion agentes (JNLP)
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock #permite usar Docker desde pipelines
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
      - TZ=Europe/Madrid
volumes:
  jenkins_home:
